# RDP on the Windows PC. SMB remains the native Windows service on 445.
# root-bridge.ps1 scopes LAB_HOST_IP in the host process; the service reads
# container credentials separately from its ignored raw lab.env file.
services:
  danstv-rdp:
    build: .
    container_name: danstv-remote-pc-lab
    restart: "no"
    init: true
    ports:
      - "${LAB_HOST_IP:?Set LAB_HOST_IP}:3389:3389"
    env_file:
      - path: ../../../.local/tiz0wn-lab/lab.env
        format: raw  # Preserve literal $ expressions in the one-shot password probe.
